name: clean_frame
description: "A CLI tool to scaffold Flutter projects with Clean Architecture and Riverpod dependency injection. Generates a fully named, ready-to-run project from a versioned GitHub template."
version: 1.3.0
homepage: https://github.com/Kaung-Myat/clean-frame
repository: https://github.com/Kaung-Myat/clean-frame

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.7.0
  http: ^1.4.0
  archive: ^4.0.7
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.26.3

executables:
  clean_frame: clean_frame
